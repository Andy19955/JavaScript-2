<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beam</title>
    <meta name="description" content="See other user's posts." />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="shortcut icon" href="/images/favicon.ico" type="image/x-icon" />
    <script src="/js/app.js" type="module"></script>
    <script src="https://kit.fontawesome.com/39adc5ba14.js" crossorigin="anonymous"></script>
  </head>
  <body class="bg-gray-100 flex flex-col min-h-screen">
    <header class="bg-white text-black shadow-md">
      <nav class="container mx-auto py-2 px-3">
        <div class="flex justify-between">
          <a href="/feed/" class="flex items-center py-4 px-2">
            <img src="/images/logo.png" alt="Beam logo with slogan" class="w-48" />
          </a>
          <div class="hidden md:flex items-center space-x-1">
            <a href="/feed" class="py-4 px-2 font-semibold hover:text-orange-700 hover:border-b-2 hover:border-b-orange-700 transition duration-300">Feed</a>
            <a href="/profile" class="py-4 px-2 font-semibold hover:text-orange-700 hover:border-b-2 hover:border-b-orange-700 transition duration-300">Profile</a>
            <a href="/" class="py-4 px-2 font-semibold hover:text-orange-700 hover:border-b-2 hover:border-b-orange-700 transition duration-300">Sign out</a>
          </div>
          <div class="flex md:hidden item-center">
            <button id="menu-button">
              <span class="hidden">Toggle menu</span>
              <svg class="w-6 h-6 text-gray-500 hover:text-orange-700" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor">
                <path d="M4 6h16M4 12h16M4 18h16"></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="hidden" id="mobile-menu">
          <ul>
            <li>
              <a href="/feed" class="block text-sm py-4 px-2 hover:bg-orange-700 hover:text-white transition duration-300">Feed</a>
            </li>
            <li>
              <a href="/profile" class="block text-sm py-4 px-2 hover:bg-orange-700 hover:text-white transition duration-300">Profile</a>
            </li>
            <li>
              <a href="/" class="block text-sm py-4 px-2 hover:bg-orange-700 hover:text-white transition duration-300">Sign out</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <main class="container mx-auto flex flex-col justify-between flex-1 gap-5 p-3">
      <section class="flex flex-col gap-3">
        <div id="messageContainer"></div>
        <div id="postLoader" class="flex flex-col gap-3">
          <div class="h-56 md:h-72 lg:h-96 animate-pulse bg-gray-300"></div>
          <div class="flex justify-between">
            <div class="h-4 w-52 animate-pulse bg-gray-300"></div>
            <div class="flex flex-col gap-1">
              <div class="h-4 w-52 animate-pulse bg-gray-300"></div>
              <div class="h-4 w-52 animate-pulse bg-gray-300"></div>
            </div>
          </div>
          <div class="h-4 w-full animate-pulse bg-gray-300"></div>
          <div class="h-4 w-full animate-pulse bg-gray-300"></div>
          <div class="h-4 w-full animate-pulse bg-gray-300"></div>
          <div class="h-4 w-full animate-pulse bg-gray-300"></div>
          <div class="h-4 w-full animate-pulse bg-gray-300"></div>
        </div>
        <img id="postImage" class="max-h-56 md:max-h-72 lg:max-h-96 object-cover" />
        <div class="flex justify-between">
          <h1 id="postTitle" class="font-bold text-2xl"></h1>
          <div class="flex flex-col">
            <span id="postAuthor">Author: <a id="postAuthorLink" class="hover:underline"></a></span>
            <span id="postCreatedDate"></span>
          </div>
        </div>
        <div id="postContainer"></div>
      </section>
      <div id="postActions"></div>
    </main>
    <footer class="text-center p-2 h-12">&copy; 2025 Beam</footer>
  </body>
</html>
